[package]
name = "vox-ai-studio"
version = "0.1.0"
description = "VOX·AI Studio — Hybrid Rust/Tauri Desktop App"
authors = ["Dicky Hadinata"]
edition = "2021"

[lib]
name = "vox_ai_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
